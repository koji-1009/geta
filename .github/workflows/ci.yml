name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., getavet, getaotel, examples/booking, examples/register-sql]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - name: go vet
        run: go vet ./...
        working-directory: ${{ matrix.module }}
      - name: go test
        run: go test ./...
        working-directory: ${{ matrix.module }}

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - name: go test -race
        run: go test -race ./...

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: getavet
        run: |
          go build -C getavet -o "$RUNNER_TEMP/getavet" ./cmd/getavet
          "$RUNNER_TEMP/getavet" -test=false ./...

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - name: geta sync -check and geta check
        run: |
          for dir in examples/register/routes examples/auth/routes examples/bookmarks/routes examples/booking/routes; do
            go run ./cmd/geta sync -check "$dir"
            go run ./cmd/geta check "$dir"
          done
      - name: getavet
        run: |
          go build -C getavet -o "$RUNNER_TEMP/getavet" ./cmd/getavet
          go vet -C examples/booking -vettool="$RUNNER_TEMP/getavet" ./...
